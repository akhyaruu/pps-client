<!-- verifikasi.html -->
<!DOCTYPE html>
<html lang="id">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Verifikasi Absensi</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">

   <style>
      .card-header .fas {
         margin-right: 8px;
      }

      .btn .fas {
         margin-right: 6px;
      }

      .status-pending {
         background-color: #f6c23e;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 12px;
         font-weight: bold;
         display: inline-block;
      }

      .status-approved {
         background-color: #1cc88a;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 12px;
         font-weight: bold;
         display: inline-block;
      }

      .status-rejected {
         background-color: #e74a3b;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 12px;
         font-weight: bold;
         display: inline-block;
      }

      .table-img {
         width: 50px;
         height: 50px;
         object-fit: cover;
         border-radius: 8px;
         cursor: pointer;
      }

      .modal-img {
         max-width: 100%;
         max-height: 80vh;
         border-radius: 8px;
      }

      .modal-alasan textarea {
         resize: vertical;
      }

      .filter-card {
         background-color: #f8f9fc;
         border-radius: 10px;
         padding: 15px;
         margin-bottom: 20px;
      }

      .badge-pending {
         background-color: #f6c23e;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 11px;
         font-weight: bold;
         display: inline-block;
      }

      .badge-approved {
         background-color: #1cc88a;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 11px;
         font-weight: bold;
         display: inline-block;
      }

      .badge-rejected {
         background-color: #e74a3b;
         color: #fff;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 11px;
         font-weight: bold;
         display: inline-block;
      }
   </style>
</head>

<body id="page-top">
   <div id="wrapper">
      <!-- sidebar -->
      <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
         <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#">
            <div class="sidebar-brand-icon rotate-n-15">
               <i class="fas fa-laugh-wink"></i>
            </div>
            <div class="sidebar-brand-text mx-3">Absensi</div>
         </a>
         <hr class="sidebar-divider my-0">
         <li class="nav-item active">
            <a class="nav-link" href="verifikasi.html">
               <i class="fas fa-fw fa-check-double"></i>
               <span>Verifikasi</span>
            </a>
         </li>
      </ul>

      <!-- content wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
         <div id="content">
            <!-- topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
               <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                  <i class="fa fa-bars"></i>
               </button>
               <span class="h5 mb-0 text-gray-800">Verifikasi Absensi</span>
               <ul class="navbar-nav ml-auto">
                  <li class="nav-item">
                     <a class="nav-link text-danger" href="#" id="logoutBtn">
                        <i class="fas fa-sign-out-alt fa-fw"></i>
                        <span>Logout</span>
                     </a>
                  </li>
               </ul>
            </nav>

            <!-- main content -->
            <div class="container-fluid">
               <div class="d-sm-flex align-items-center justify-content-between mb-4">
                  <h1 class="h3 mb-0 text-gray-800">Verifikasi Absensi Pending</h1>
               </div>

               <!-- filter card -->
               <div class="filter-card">
                  <div class="row">
                     <div class="col-md-3">
                        <label><i class="fas fa-calendar-alt"></i> Dari Tanggal</label>
                        <input type="date" class="form-control" id="filterStartDate">
                     </div>
                     <div class="col-md-3">
                        <label><i class="fas fa-calendar-alt"></i> Sampai Tanggal</label>
                        <input type="date" class="form-control" id="filterEndDate">
                     </div>
                     <div class="col-md-2">
                        <label><i class="fas fa-filter"></i> Status</label>
                        <select class="form-control" id="filterStatus">
                           <option value="all">Semua Status</option>
                           <option value="pending" selected>Pending</option>
                           <option value="approved">Approved</option>
                           <option value="rejected">Rejected</option>
                        </select>
                     </div>
                     <div class="col-md-2">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary btn-block" id="filterBtn">
                           <i class="fas fa-search"></i> Filter
                        </button>
                     </div>
                  </div>
               </div>

               <!-- tabel data -->
               <div class="card shadow mb-4">
                  <div class="card-header py-3">
                     <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-list"></i> Daftar Absensi Pending
                     </h6>
                  </div>
                  <div class="card-body">
                     <div class="table-responsive">
                        <table class="table table-bordered table-hover" id="dataTable" width="100%" cellspacing="0">
                           <thead>
                              <tr>
                                 <th>No</th>
                                 <th>Tanggal</th>
                                 <th>Jam Masuk</th>
                                 <th>Nama</th>
                                 <th>Lokasi</th>
                                 <th>Status</th>
                                 <th>Foto</th>
                                 <th>Catatan</th>
                                 <th>Aksi</th>
                              </tr>
                           </thead>
                           <tbody id="tableBody">
                              <tr>
                                 <td colspan="9" class="text-center">Loading data...</td>
                              </tr>
                           </tbody>
                        </table>
                     </div>
                     <div id="pagination" class="mt-3 text-center"></div>
                  </div>
               </div>
            </div>
         </div>

         <!-- footer -->
         <footer class="sticky-footer bg-white">
            <div class="container my-auto">
               <div class="copyright text-center my-auto">
                  <span>Copyright &copy; Sistem Absensi 2026</span>
               </div>
            </div>
         </footer>
      </div>
   </div>

   <!-- modal lihat foto -->
   <div class="modal fade" id="photoModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title"><i class="fas fa-image"></i> Bukti Foto Absensi</h5>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
               </button>
            </div>
            <div class="modal-body text-center">
               <img id="modalFoto" class="modal-img" src="" alt="Bukti foto absensi">
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary" data-dismiss="modal">Tutup</button>
            </div>
         </div>
      </div>
   </div>

   <!-- modal alasan penolakan -->
   <div class="modal fade" id="rejectModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title"><i class="fas fa-ban"></i> Tolak Absensi</h5>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
               </button>
            </div>
            <div class="modal-body">
               <label>Alasan Penolakan <span class="text-danger">*</span></label>
               <textarea id="alasanPenolakan" class="form-control" rows="4"
                  placeholder="Isikan alasan mengapa absensi ini ditolak..."></textarea>
               <input type="hidden" id="rejectId">
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
               <button type="button" class="btn btn-danger" id="confirmRejectBtn">
                  <i class="fas fa-check"></i> Ya, Tolak
               </button>
            </div>
         </div>
      </div>
   </div>

   <!-- bootstrap JS + dependencies -->
   <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/js/sb-admin-2.min.js"></script>

   <script>
      const API_BASE = 'http://localhost:3000/absensi';

      async function loadData() {
         try {
            const response = await fetch(`${API_BASE}/?status_validasi=pending`);
            const result = await response.json();

            if (result.status && result.status.code === 200) {
               const data = result.data && result.data.data ? result.data.data : [];
               const sortedData = [...data].reverse();
               renderTable(sortedData);
            } else {
               console.error("Gagal load data:", result.status?.msg || "Unknown error");
               renderTable([]);
            }
         } catch (error) {
            console.error("Error fetch:", error);
            renderTable([]);
         }
      }

      function renderTable(data) {
         const tbody = document.getElementById('tableBody');

         if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center">Tidak ada data</td></tr>';
            return;
         }

         let html = '';
         data.forEach((item, index) => {

            let statusBadge = '';
            if (item.status_validasi === 'pending') {
               statusBadge = '<span class="badge-pending"><i class="fas fa-clock"></i> Pending</span>';
            } else if (item.status_validasi === 'approved') {
               statusBadge = '<span class="badge-approved"><i class="fas fa-check"></i> Approved</span>';
            } else if (item.status_validasi === 'rejected') {
               statusBadge = '<span class="badge-rejected"><i class="fas fa-times"></i> Rejected</span>';
            } else {
               statusBadge = '<span class="badge-secondary">' + (item.status_validasi || '-') + '</span>';
            }

            let actionButtons = '';
            if (item.status_validasi === 'pending') {
               actionButtons = `
                <button class="btn btn-sm btn-success mr-1" onclick="approveData(${item.id})">
                    <i class="fas fa-check"></i> Setuju
                </button>
                <button class="btn btn-sm btn-danger" onclick="showRejectModal(${item.id})">
                    <i class="fas fa-times"></i> Tolak
                </button>
            `;
            } else {
               actionButtons = '<span class="text-muted">-</span>';
            }

            const namaPegawai = item.pegawai ? item.pegawai.nama : '-';

            html += `
            <tr>
               <td class="text-center">${index + 1}</td>
               <td>${item.tanggal || '-'}</td>
               <td>${item.jam_masuk || '-'}</td>
               <td>${namaPegawai}</td>
               <td>${item.lokasi_masuk || '-'}</td>
               <td class="text-center">${statusBadge}</td>
               <td class="text-center">
                  <i class="fas fa-camera fa-1x" 
                     style="cursor: pointer; color: #4e73df;" 
                     onclick="lihatFoto(${item.id})">
                  </i>
                  <br>
                  <small class="text-muted" style="font-size: 10px;">Klik untuk lihat</small>
               </td>
               <td>${item.catatan || ''}</td>
               <td class="text-center">${actionButtons}</td>
            </tr>
        `;
         });

         tbody.innerHTML = html;
      }

      async function approveData(id) {
         if (!confirm('Setujui absensi ini?')) return;

         try {
            const response = await fetch(`${API_BASE}/approve/${id}`, {
               method: 'PUT',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({
                  validasi_oleh: 'Admin-001'
               })
            });

            const result = await response.json();

            if (result.status && result.status.code === 200) {
               alert('Absensi berhasil disetujui');
               loadData(); // reload tabel
            } else {
               alert('Gagal: ' + (result.status?.msg || 'Terjadi kesalahan'));
            }
         } catch (error) {
            alert('Error: ' + error.message);
         }
      }

      window.showRejectModal = function (id) {
         document.getElementById('rejectId').value = id;
         document.getElementById('alasanPenolakan').value = '';
         $('#rejectModal').modal('show');
      };

      document.getElementById('confirmRejectBtn').addEventListener('click', async function () {
         const id = document.getElementById('rejectId').value;
         const alasan = document.getElementById('alasanPenolakan').value;

         if (!alasan.trim()) {
            alert('Alasan penolakan wajib diisi!');
            return;
         }

         try {
            const response = await fetch(`${API_BASE}/reject/${id}`, {
               method: 'PUT',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({
                  rejection_reason: alasan,
                  validasi_oleh: 'Admin-001'
               })
            });

            const result = await response.json();

            if (result.status && result.status.code === 200) {
               alert('Absensi berhasil ditolak');
               $('#rejectModal').modal('hide');
               loadData(); // reload tabel
            } else {
               alert('Gagal: ' + (result.status?.msg || 'Terjadi kesalahan'));
            }
         } catch (error) {
            alert('Error: ' + error.message);
         }
      });

      window.lihatFoto = function (id) {
         const fotoUrl = `${API_BASE}/photo/${id}`;
         document.getElementById('modalFoto').src = fotoUrl;
         $('#photoModal').modal('show');
      };

      document.getElementById('filterBtn').addEventListener('click', async function () {
         const startDate = document.getElementById('filterStartDate').value;
         const endDate = document.getElementById('filterEndDate').value;
         const status = document.getElementById('filterStatus').value;

         let queryParams = [];

         if (status && status !== 'all') {
            queryParams.push(`status_validasi=${status}`);
         }
         if (startDate) {
            queryParams.push(`startDate=${startDate}`);
         }
         if (endDate) {
            queryParams.push(`endDate=${endDate}`);
         }

         let url = `${API_BASE}/`;
         if (queryParams.length > 0) {
            url += `?${queryParams.join('&')}`;
         }

         try {
            const response = await fetch(url);
            const result = await response.json();

            if (result.status && result.status.code === 200) {
               const data = result.data && result.data.data ? result.data.data : [];
               const sortedData = [...data].reverse();
               renderTable(sortedData);
            } else {
               console.error("Filter gagal:", result.status?.msg);
               renderTable([]);
            }
         } catch (error) {
            console.error("Error filter:", error);
            renderTable([]);
         }
      });

      document.getElementById('logoutBtn').addEventListener('click', (e) => {
         e.preventDefault();
         if (confirm('Yakin ingin logout?')) {
            window.location.href = 'login.html';
         }
      });

      loadData();
   </script>
</body>

</html>
