<!DOCTYPE html>
<html lang="id">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login - Sistem Absensi</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
   <link href="css/style.css" rel="stylesheet">

   <style>
      .bg-gradient-primary {
         background: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
         background-size: cover;
      }

      .card-o-hidden {
         border-radius: 1rem;
      }

      .btn-user {
         font-size: 0.9rem;
         border-radius: 10rem;
         padding: 0.75rem 1rem;
      }

      .form-control-user {
         border-radius: 10rem;
         padding: 0.75rem 1rem;
      }

      .custom-control-label {
         cursor: pointer;
      }

      .fa-laugh-wink {
         animation: bounce 1s ease infinite;
      }

      @keyframes bounce {

         0%,
         100% {
            transform: translateY(0);
         }

         50% {
            transform: translateY(-5px);
         }
      }
   </style>
</head>

<body class="bg-gradient-primary">
   <div class="container">
      <div class="row justify-content-center">
         <div class="col-xl-5 col-lg-6 col-md-8">
            <div class="card o-hidden border-0 shadow-lg my-5">
               <div class="card-body p-0">
                  <div class="p-5">
                     <div class="text-center">
                        <div class="mb-3">
                           <i class="fas fa-laugh-wink fa-3x text-primary"></i>
                        </div>
                        <h1 class="h4 text-gray-900 mb-4">Sistem Absensi</h1>
                        <p class="text-muted small">Silakan login untuk melanjutkan</p>
                        <hr class="my-3">
                     </div>

                     <!-- form Login -->
                     <form id="loginForm" class="user">
                        <div class="form-group">
                           <label for="username" class="text-gray-700 small font-weight-bold">
                              <i class="fas fa-envelope"></i> Email / Username
                           </label>
                           <input type="text" class="form-control form-control-user" id="username" name="username"
                              placeholder="Masukkan email atau username" required>
                        </div>

                        <div class="form-group">
                           <label for="password" class="text-gray-700 small font-weight-bold">
                              <i class="fas fa-lock"></i> Password
                           </label>
                           <input type="password" class="form-control form-control-user" id="password" name="password"
                              placeholder="Masukkan password" required>
                        </div>

                        <div class="form-group">
                           <div class="custom-control custom-checkbox small">
                              <input type="checkbox" class="custom-control-input" id="rememberMe">
                              <label class="custom-control-label" for="rememberMe">Ingat saya</label>
                           </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                           <i class="fas fa-sign-in-alt"></i> Login
                        </button>

                        <hr>

                        <div class="text-center">
                           <a class="small" href="forgot-password.html">Lupa password?</a>
                        </div>
                        <div class="text-center">
                           <p class="small text-muted mt-3 mb-0">
                              Demo: <strong>admin@example.com</strong> / <strong>password</strong>
                           </p>
                        </div>
                     </form>

                     <div id="alertMessage" class="mt-3" style="display: none;"></div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <!-- bootstrap JS + dependencies -->
   <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/js/sb-admin-2.min.js"></script>

   <!-- custom JS -->
   <script>
      const loginForm = document.getElementById('loginForm');
      const alertMessage = document.getElementById('alertMessage');

      loginForm.addEventListener('submit', async (e) => {
         e.preventDefault();

         const username = document.getElementById('username').value;
         const password = document.getElementById('password').value;
         const rememberMe = document.getElementById('rememberMe').checked;

         // demo validasi sederhana (nanti diganti dengan panggilan API backend)
         if (username === 'admin@example.com' || username === 'admin') {
            if (password === 'password') {
               alertMessage.style.display = 'none';

               // simpan session (demo)
               if (rememberMe) {
                  localStorage.setItem('isLoggedIn', 'true');
                  localStorage.setItem('username', username);
               } else {
                  sessionStorage.setItem('isLoggedIn', 'true');
                  sessionStorage.setItem('username', username);
               }

               // redirect ke dashboard
               window.location.href = 'checkin.html';
            } else {
               showAlert('Password salah!', 'danger');
            }
         } else {
            showAlert('Username tidak ditemukan!', 'danger');
         }
      });

      function showAlert(message, type) {
         alertMessage.style.display = 'block';
         alertMessage.className = `alert alert-${type} alert-dismissible fade show`;
         alertMessage.innerHTML = `
            ${message}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
               <span aria-hidden="true">&times;</span>
            </button>
         `;
      }
   </script>
</body>

</html>
